<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScrollPeak</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- MDN: a popup cannot scroll vertically -- Firefox resizes it to fit
         the content, capped at 800x600. Anything unbounded (the site list)
         belongs on the options page, not here. -->
    <main class="panel">
      <header class="head">
        <img class="head__icon" src="../icons/scrollpeak.svg" alt="" width="20" height="20" />
        <div class="head__text">
          <h1 class="head__title">ScrollPeak</h1>
          <p class="head__host" id="host">this site</p>
        </div>
        <span class="pill" id="state-pill" hidden>off here</span>
      </header>

      <label class="row row--strong">
        <input type="checkbox" id="site-toggle" />
        <span>Show the minimap on this site</span>
      </label>

      <hr class="rule" />

      <fieldset class="seg">
        <legend class="seg__legend">Scrollbar</legend>
        <div class="seg__group">
          <label class="seg__opt">
            <input type="radio" name="scrollbarMode" value="always" />
            <span>Always</span>
          </label>
          <label class="seg__opt">
            <input type="radio" name="scrollbarMode" value="whenNeeded" />
            <span>When needed</span>
          </label>
          <label class="seg__opt">
            <input type="radio" name="scrollbarMode" value="never" />
            <span>Never</span>
          </label>
        </div>
      </fieldset>

      <label class="row">
        <input type="checkbox" id="showMagnifier" />
        <span>Text preview on hover</span>
      </label>

      <label class="row">
        <input type="checkbox" id="showMarkers" />
        <span>Heading marks on the track</span>
      </label>

      <label class="slider">
        <span class="slider__label">Minimap width</span>
        <input type="range" id="minimapWidth" min="20" max="200" step="2" />
        <output class="slider__out" id="minimapWidth-out">60px</output>
      </label>

      <hr class="rule" />

      <label class="row">
        <input type="checkbox" id="hideTrack" />
        <span>Minimap only, no track</span>
      </label>

      <label class="row">
        <input type="checkbox" id="hideWhenIdle" />
        <span>Hide until I scroll or approach</span>
      </label>

      <footer class="foot">
        <button type="button" class="foot__main" id="open-options">
          All settings
        </button>

        <nav class="foot__links" aria-label="About ScrollPeak">
          <button type="button" class="link" data-url="https://github.com/sky-is-green/scrollpeak"
                  title="The source code for this extension, on GitHub">
            Source
          </button>
          <button type="button" class="link" data-url="https://kate-editor.org"
                  title="Kate, the editor this minimap is a port of — the original lives in its scrollbar">
            Kate
          </button>
          <button type="button" class="link" data-url="https://github.com/sky-is-green/scrollpeak/issues"
                  title="Report a bug or ask for something, on GitHub">
            Report
          </button>
        </nav>

        <p class="foot__sites" id="site-count"></p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
