<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="strip">
      <rect x="58" y="10" width="26" height="76" rx="3" />
    </clipPath>
  </defs>

  <!-- Stylised page: a column of text blocks down the left. -->
  <g fill="#8a8a99">
    <rect x="14" y="14" width="30" height="8" rx="2" />
    <rect x="14" y="30" width="30" height="4" rx="2" />
    <rect x="14" y="39" width="30" height="4" rx="2" />
    <rect x="14" y="48" width="30" height="4" rx="2" />
    <rect x="14" y="57" width="30" height="4" rx="2" />
    <rect x="14" y="66" width="30" height="4" rx="2" />
    <rect x="14" y="75" width="20" height="4" rx="2" />
  </g>

  <!-- The minimap strip itself. -->
  <g clip-path="url(#strip)">
    <rect x="58" y="10" width="26" height="76" fill="#ececf2" />

    <!-- Block map: varied widths so the structure reads as a document, not
         a solid bar. -->
    <g fill="#4a4a5a">
      <rect x="60" y="12" width="22" height="7" rx="1" />
      <rect x="60" y="21" width="22" height="3" rx="1" />
      <rect x="60" y="26" width="22" height="3" rx="1" />
      <rect x="60" y="31" width="16" height="3" rx="1" />
      <rect x="60" y="38" width="22" height="6" rx="1" />
      <rect x="60" y="46" width="22" height="3" rx="1" />
      <rect x="60" y="51" width="22" height="3" rx="1" />
      <rect x="60" y="56" width="13" height="3" rx="1" />
      <rect x="60" y="64" width="22" height="3" rx="1" />
      <rect x="60" y="69" width="22" height="3" rx="1" />
      <rect x="60" y="74" width="22" height="3" rx="1" />
      <rect x="60" y="79" width="18" height="5" rx="1" />
    </g>

    <!-- Current viewport. -->
    <rect x="58" y="26" width="26" height="20" fill="#3b6ea5" opacity="0.22" />
    <rect x="58" y="26" width="26" height="20" fill="none"
          stroke="#3b6ea5" stroke-width="1.5" />
  </g>

  <rect x="58" y="10" width="26" height="76" rx="3" fill="none"
        stroke="#4a4a5a" stroke-width="1.5" />

  <!-- Magnifier: the distinguishing feature, shown as a lens over the strip. -->
  <g>
    <rect x="18" y="30" width="32" height="26" rx="3" fill="#ffffff"
          stroke="#3b6ea5" stroke-width="2" />
    <g fill="#4a4a5a" transform="translate(22 34) scale(1.6)">
      <rect x="0" y="0" width="15" height="3" rx="1" />
      <rect x="0" y="5" width="15" height="2" rx="1" />
      <rect x="0" y="9" width="10" height="2" rx="1" />
    </g>
    <path d="M46 52 L58 44" stroke="#3b6ea5" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
