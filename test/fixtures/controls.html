<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScrollPeak controls fixture</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0 auto; max-width: 40rem;
         padding: 2rem 1rem 6rem; color: #1c1c1e; background: #fdfdfc; }
  h1 { color: #10233f; }
  h2 { color: #1d4e89; }
  .row { margin: 1rem 0; }
  input[type="text"], select, textarea { font: inherit; padding: 2px 6px; }
  .spacer { height: 35vh; }
</style>
</head>
<body>
<h1>Controls on the map</h1>
<p>A short page whose structure is mostly form controls, so the block map has
to decide what to do with them.</p>

<div class="row">
  <label for="name">Name</label>
  <input type="text" id="name" size="24" />
</div>
<div class="row">
  <label><input type="checkbox" id="agree" /> Agree to the terms</label>
</div>
<div class="row">
  <label><input type="radio" name="pick" id="one" /> One</label>
  <label><input type="radio" name="pick" id="two" /> Two</label>
</div>
<div class="row">
  <label for="vol">Volume</label>
  <input type="range" id="vol" min="0" max="10" />
</div>
<div class="row">
  <label for="choice">Choice</label>
  <select id="choice"><option>Alpha</option><option>Beta</option></select>
</div>
<div class="row">
  <label for="notes">Notes</label>
  <textarea id="notes" rows="3" cols="30"></textarea>
</div>
<div class="row">
  <button type="button">Send</button>
  <output id="total">Result text</output>
</div>

<div class="spacer"></div>
<p>Some text after the controls, so the map has a lower bound.</p>
</body>
</html>
