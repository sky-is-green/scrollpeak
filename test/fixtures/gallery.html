<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>ScrollPeak gallery fixture</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 1rem 0 3rem;
         color: #1c1c1e; background: #fdfdfc; }
  h1, h2 { max-width: 960px; margin: .5rem auto; padding: 0 1rem; color: #10233f; }
  h2 { color: #1d4e89; }
  /* A card grid: no video, no article, mostly pictures. The detector should
     read this as a media page from the pictures alone. */
  .grid { display: grid; grid-template-columns: repeat(4, 300px);
          gap: 16px; justify-content: center; }
  .grid img { display: block; width: 300px; height: 200px; }
</style>
</head>
<body>
<h1>A gallery of pictures</h1>
<p style="max-width:960px;margin:0 auto;padding:0 1rem">Twelve or more large
pictures and almost no text: the media renderer's second trigger.</p>
